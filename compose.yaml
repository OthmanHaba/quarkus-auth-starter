services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_starter
      POSTGRES_USER: auth_starter
      POSTGRES_PASSWORD: auth_starter
    ports:
      - "5432:5432"
    volumes:
      - auth-starter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_starter -d auth_starter"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  auth-starter-postgres-data:
