quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

app.auth.stateful-origins=http://localhost:3000,https://app.example.com
app.auth.session-cookie-name=app_session
app.auth.csrf-cookie-name=XSRF-TOKEN
app.auth.session-duration=PT8H
app.auth.token-default-expiration=P30D
app.auth.last-used-update-interval=PT5M
app.auth.revoked-retention=P30D
app.auth.cookie-secure=true
app.auth.cookie-same-site=LAX

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,https://app.example.com
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-XSRF-TOKEN
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

%dev.quarkus.datasource.username=auth_starter
%dev.quarkus.datasource.password=auth_starter
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auth_starter
%dev.app.auth.cookie-secure=false

%prod.quarkus.datasource.username=${DB_USERNAME:auth_starter}
%prod.quarkus.datasource.password=${DB_PASSWORD:auth_starter}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_starter}

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.reuse=false
%test.app.auth.cookie-secure=false
